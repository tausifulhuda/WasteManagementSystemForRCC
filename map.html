<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style2.css">
        <title>Map of Secondary Transfer Stations</title>
    </head>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.querySelector(".map_container"); 
            const img = document.querySelector(".map_img");

            if (!img || !container) {
                console.log("Element not found!");
                return;
            }
            let scale = 1;
            img.addEventListener("wheel", function(e) {
                e.preventDefault();

                if (e.deltaY < 0) scale += 0.1;
                else scale -= 0.1;

                scale = Math.min(Math.max(0.5, scale), 4);
                img.style.transform = `scale(${scale})`;
            });
            container.addEventListener("mouseleave", function () {
                scale = 1;
                img.style.transform = `scale(1)`; 
            });

            container.addEventListener("click", function () {
                scale += 0.2;
                scale = Math.min(scale, 4);
                img.style.transform = `scale(${scale})`;
            });

            container.addEventListener("contextmenu", function (e) {
                e.preventDefault(); // disable menu

                scale -= 0.2;
                scale = Math.max(scale, 0.5);
                img.style.transform = `scale(${scale})`;
            });

            container.addEventListener("mouseleave", function () {
                scale = 1;
                img.style.transform = `scale(1)`;
            });
        });
    </script>
    
    <div class="header">
        <a href="http://erajshahi.portal.gov.bd/" target="_blank">
            <img class="logo" src="images/rcc_logo.png">
        </a>
        <h3>WASTE MANAGEMENT SYSTEM FOR RCC</h3>
        <a class="about_button" href="about.html">ABOUT</a>
        <a class="map" href="sts.html">STS</a>
        <a class="home" href="index.html">HOME</a>
    </div>
    <div>
        <h1>MAP FOR SECONDARY TRANSFER STATIONS</h1>
    </div>
    <div class="map_container">
        <img src="images/map.png" class="map_img">
    </div>
</html>
